# The native holder guest: `licash::statement::StatementInput` in the RISC
# Zero zkVM. A workspace of its own, built with RISC Zero's guest toolchain
# (r0/build-guest.sh), as Lichen's guests are.
[package]
name = "licash-native-claim"
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace]
resolver = "3"

[dependencies]
licash = { path = "../../crates/licash" }
licash-groth16 = { path = "../../crates/licash-groth16" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }

# RISC Zero's accelerated crypto, the same tags as Lichen's guests.
[patch.crates-io]
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
