# The guests' host: packs ELFs with the zkOS kernel, executes inputs (cycle
# counts), proves them (succinct, wrapped in Groth16) and verifies receipts.
# A workspace of its own: the prover is heavy.
[package]
name = "licash-r0"
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace]
resolver = "3"

[dependencies]
licash-hp = { path = "../../crates/licash-hp" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["prove", "std"] }
risc0-binfmt = "=3.0.6"
risc0-zkos-v1compat = "=2.2.3"
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
tempfile = "3"

[profile.release]
debug = 1
