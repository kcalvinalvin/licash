# The Hub's statement guest: `licash_hp::check` in the RISC Zero zkVM,
# built with r0/build-guest.sh hp. The holder garbles for its Groth16
# wrap at opening (BABE with the roles swapped); the Hub proves only if
# she challenges its assertion.
[package]
name = "licash-hp-guest"
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.97"

[workspace]
resolver = "3"

[features]
# Print the cycles each step of the statement takes, for measurements: not
# a program to keep (r0/build-guest.sh hp-profile).
profile = []

[dependencies]
licash-hp = { path = "../../crates/licash-hp" }
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["std"] }

# RISC Zero's accelerated crypto: the notes' and holds' signatures, the
# issuer's DLEQs, and the chain's and the statement's SHA-256.
[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
