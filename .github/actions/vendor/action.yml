name: vendor
description: >-
  Lichen at the revision vendor/fetch.sh pins, copied into vendor/ as it
  does: the applications' workspace builds the recovery contract on it.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: lichenbtc-org/lichen
        ref: 5cd7efc768270ccf42eb9f5a8ee3f1158b12555c
        path: .vendor-src/lichen
        persist-credentials: false
    - shell: sh
      run: |
        LICHEN_GIT="$GITHUB_WORKSPACE/.vendor-src/lichen" vendor/fetch.sh
