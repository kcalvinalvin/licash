name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
  apps:
    runs-on: ubuntu-latest
    # The mobile prover builds the RISC Zero prover.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - working-directory: apps
        run: cargo fmt --all -- --check
      - working-directory: apps
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - working-directory: apps
        run: cargo test --locked --workspace
      - working-directory: apps
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Hub image
        run: docker build -f apps/hub/Dockerfile .
      - name: Wallet image
        run: docker build -f apps/wallet-cli/Dockerfile .
      - name: Swaps image
        run: docker build -f apps/swaps/Dockerfile .
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile/chain
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/mobile/chain/go.mod
          cache-dependency-path: apps/mobile/chain/go.sum
      - name: Official neutrino at the pinned hash, with this repository's patches
        run: upstream/materialize.sh && upstream/materialize.sh --check
      - run: test -z "$(gofmt -l mempool node mobile)"
      - run: go vet ./... && go vet -tags regtest ./...
      - run: go test -race ./...
      - name: Light client, block-dn import and mempool against Bitcoin Core in regtest
        run: ./regtest.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/mobile/chain/go.mod
          cache-dependency-path: apps/mobile/chain/go.sum
      - name: Official neutrino, and gomobile at the version go.mod pins
        working-directory: apps/mobile/chain
        run: |
          upstream/materialize.sh
          version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$version golang.org/x/mobile/cmd/gobind@$version
          gomobile init
      - name: Wallet core, its Kotlin bindings and the light client's AAR
        working-directory: apps/mobile/android
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME ./native.sh
      - name: App
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - name: Hubs, gateways and wallets on a regtest ecosystem
        run: apps/e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: apps/target/e2e/
  app-e2e:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: ${{ runner.temp }}/app
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app on an emulator, on the regtest ecosystem
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LICASH_E2E_APP: ${{ runner.temp }}/app/app-debug.apk
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: apps/e2e/run.sh the_app_is
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-logs
          path: apps/target/e2e/
  regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: licash
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdamISZ/lichen
          ref: 82c69a055a8ac9f2010d1f91ff15eef7ac1ca8ab
          path: lichen
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdamISZ/ln-gap
          ref: d7972035c12247a07b1dcc1b32e1682cd790d276
          path: ln-gap
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: licash/regtest
      - working-directory: licash
        run: cargo fmt --manifest-path regtest/Cargo.toml -p licash-regtest -p licash-contract -- --check
      - working-directory: licash
        run: cargo clippy --locked --manifest-path regtest/Cargo.toml --workspace --all-targets --no-deps -- -D warnings
      - name: Groth16 verifier agrees with golden receipts
        working-directory: licash
        run: CARGO_TARGET_DIR=regtest/target cargo test --locked --manifest-path crates/licash-groth16/Cargo.toml
      - name: Bitcoin Core regtest (mock proofs)
        working-directory: licash
        run: regtest/run.sh -- --test-threads=1
      - name: Lightning gateway against pinned LND
        working-directory: licash
        run: regtest/lightning.sh
