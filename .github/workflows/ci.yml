name: ci
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - working-directory: apps
        run: cargo fmt --all -- --check
      - working-directory: apps
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - working-directory: apps
        run: cargo test --locked --workspace
      - working-directory: apps
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Hub image
        run: docker build -f apps/hub/Dockerfile .
      - name: Wallet image
        run: docker build -f apps/wallet-cli/Dockerfile .
      - name: Swaps image
        run: docker build -f apps/swaps/Dockerfile .
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - name: Hubs, gateways and wallets on a regtest ecosystem
        run: apps/e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: apps/target/e2e/
  regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: licash
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdamISZ/lichen
          ref: 82c69a055a8ac9f2010d1f91ff15eef7ac1ca8ab
          path: lichen
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AdamISZ/ln-gap
          ref: d7972035c12247a07b1dcc1b32e1682cd790d276
          path: ln-gap
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: licash/regtest
      - working-directory: licash
        run: cargo fmt --manifest-path regtest/Cargo.toml -- --check
      - working-directory: licash
        run: cargo clippy --locked --manifest-path regtest/Cargo.toml --all-targets --no-deps -- -D warnings
      - name: Groth16 verifier agrees with golden receipts
        working-directory: licash
        run: CARGO_TARGET_DIR=regtest/target cargo test --locked --manifest-path crates/licash-groth16/Cargo.toml
      - name: Bitcoin Core regtest (mock proofs)
        working-directory: licash
        run: regtest/run.sh -- --test-threads=1
      - name: Lightning gateway against pinned LND
        working-directory: licash
        run: regtest/lightning.sh
