[workspace]
resolver = "2"
members = ["crates/licash", "crates/licash-api", "crates/licash-hub", "crates/licash-wallet"]
# r0/ (RISC Zero guests and host), regtest/ (Bitcoin integration, needs
# ../lichen and ../ln-gap) and apps/ (the applications) are workspaces of
# their own.
exclude = ["r0", "regtest", "apps", "crates/licash-groth16"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
k256 = { version = "0.13", features = ["schnorr", "ecdh", "arithmetic"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "1"
bincode = "1.3"
serde_bytes = "0.11"
