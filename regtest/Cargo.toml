[package]
name = "licash-regtest"
version = "0.0.1"
edition = "2021"
publish = false
description = "licash's recovery contract on Lichen's BABE graph, played on a local regtest"

# A workspace of its own, with the contract library: they pull Lichen and
# ln-gap by path, which the core library must not depend on.
[workspace]
members = ["../crates/licash-contract", "../crates/licash-hp"]

[dependencies]
licash = { path = "../crates/licash" }
licash-contract = { path = "../crates/licash-contract", features = ["fixture"] }
lichen-babe = { path = "../vendor/lichen/crates/babe" }
licash-groth16 = { path = "../crates/licash-groth16" }
lngap-btc = { path = "../vendor/ln-gap/crates/btc" }
lngap-channel = { path = "../vendor/ln-gap/crates/channel" }
lngap-lamport = { path = "../vendor/ln-gap/crates/lamport" }
lngap-sessions = { path = "../vendor/ln-gap/crates/apps/sessions" }
lngap-zk = { path = "../vendor/ln-gap/crates/apps/zk" }
anyhow = "1"
bincode = "1.3"
bitcoincore-rpc = "0.19"
hex = "0.4"
rand_chacha = "0.3"
rand_core = "0.6"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
ark-bn254 = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
k256 = { version = "0.13", features = ["hash2curve"] }

[dev-dependencies]
schnorr_fun = "0.13"
bitcoin-scriptexec = { git = "https://github.com/FairgateLabs/rust-bitcoin-scriptexec/", tag = "v0.6.0" }

[profile.release]
debug = 1

# ln-gap's BitVMX-CPU fork, as Lichen's and ln-gap's workspaces
# patch it (pulled in through lngap-sessions).
[patch."https://github.com/FairgateLabs/BitVMX-CPU"]
emulator = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
bitvmx-cpu-definitions = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
bitcoin-script-riscv = { git = "https://github.com/AdamISZ/BitVMX-CPU", rev = "0b7d285fc5c7795d16fd58d380ff6ef25f2f0423" }
