# The recovery contract's crates, a workspace of their own: they pull
# Lichen, which the core library must not depend on.
# The contract is played on Bitcoin by the hub service's tests
# (apps/hub/tests/contracts.rs, run.sh here).
[workspace]
resolver = "2"
members = ["../crates/licash-chain", "../crates/licash-contract", "../crates/licash-hp", "../crates/licash-statement"]

# Dependencies optimized in tests as Lichen's workspace does: BABE's
# garbling takes half a minute an instance at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
