[package]
name = "licash-nostr"
description = "Licash hubs and swap providers announced on Nostr relays, and discovered there"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-wsocket = { version = "0.17", default-features = false, optional = true }
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink"], optional = true }
licash-api = { workspace = true, optional = true }
licash-tor = { workspace = true, optional = true }
licash-wallet = { workspace = true, optional = true }
nostr = { version = "0.45.7", default-features = false, features = ["std", "os-rng", "nip59"] }
nostr-sdk = "0.45.6"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"], optional = true }
tracing.workspace = true

[dev-dependencies]
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }

[features]
# Reach relays through a Tor client of the application's own.
tor = ["dep:async-wsocket", "dep:futures-util", "dep:licash-tor", "dep:tokio-tungstenite"]
# Pay payment codes and take the mailbox's payments with a Licash wallet.
wallet = ["dep:bitcoin", "dep:futures-util", "dep:licash-api", "dep:licash-wallet"]
