[package]
name = "licash-lightning"
description = "A Lightning node as Licash's gateways and providers use it: LND over its REST API, and an in-memory node for tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.23"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "secp-recovery"], optional = true }
hex = "0.4"
lightning-invoice = { version = "0.34", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true

[features]
# An in-memory Lightning node, for tests.
fake = ["dep:bitcoin"]
