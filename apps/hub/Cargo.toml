[package]
name = "licash-hub-service"
description = "The Licash hub service: the hub engine behind its HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-hub"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-chain-client.workspace = true
licash-hub.workspace = true
licash-nostr.workspace = true
licash-notify.workspace = true
licash-tor.workspace = true
anyhow.workspace = true
axum.workspace = true
base64 = "0.23"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std", "secp-recovery"] }
clap.workspace = true
hex = "0.4"
lightning-invoice = { version = "0.34", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# An in-memory Lightning node, for tests.
fake = []

[dev-dependencies]
licash-hub-service = { path = ".", features = ["fake"] }
licash-wallet.workspace = true
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
