[package]
name = "licash-hub-service"
description = "The Licash hub service: the hub engine behind its HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-hub"
path = "src/main.rs"

[dependencies]
licash-api.workspace = true
licash-hub.workspace = true
licash-notify.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
licash.workspace = true
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
hex = "0.4"
rusqlite = "0.42"
serde = "1"
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
