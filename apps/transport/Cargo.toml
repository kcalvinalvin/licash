[package]
name = "licash-transport"
description = "How Licash applications reach hubs and swap providers: HTTP(S), directly or through a proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
licash-wallet.workspace = true
anyhow.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "static-sqlite", "vanguards"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.12", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", features = ["tokio"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"], optional = true }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"], optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3.27"
tokio = { workspace = true, features = ["time"] }

[features]
# Reach hubs and providers through a Tor client of the application's own.
tor = [
    "dep:arti-client",
    "dep:futures-util",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tor-rtcompat",
    "dep:webpki-roots",
]
