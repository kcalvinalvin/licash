[package]
name = "licash-wallet-cli"
description = "The Licash wallet on the command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-wallet"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-wallet.workspace = true
anyhow.workspace = true
clap.workspace = true
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
licash-hub.workspace = true
licash-hub-service = { path = "../hub" }
axum.workspace = true
tempfile = "3.27"
tokio = { workspace = true, features = ["sync"] }
