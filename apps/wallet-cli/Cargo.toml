[package]
name = "licash-wallet-cli"
description = "The Licash wallet on the command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "licash-wallet"
path = "src/main.rs"

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-wallet.workspace = true
licash-nostr.workspace = true
licash-transport = { workspace = true, features = ["tor"] }
anyhow.workspace = true
clap.workspace = true
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-hub.workspace = true
licash-hub-service = { path = "../hub", features = ["fake"] }
licash-swaps.workspace = true
licash-swaps-service = { path = "../swaps" }
axum.workspace = true
nostr-sdk = { version = "0.45.6", features = ["local-relay"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["sync"] }
