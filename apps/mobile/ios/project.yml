# The Xcode project, made by `xcodegen generate` once ./native.sh has built
# what the app links into build/native.
name: Licash
options:
  bundleIdPrefix: org.licash
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # The wallet core's Swift bindings over its static library.
  LicashCore:
    type: framework
    platform: iOS
    sources:
      - path: build/native/swift/LicashCore.swift
    dependencies:
      - framework: build/native/LicashCoreFFI.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.licash.core
        GENERATE_INFOPLIST_FILE: YES
        # What the core's crates link on Apple's systems.
        OTHER_LDFLAGS: -framework Security -framework SystemConfiguration -framework CoreFoundation
  Licash:
    type: application
    platform: iOS
    sources:
      - path: Licash
    dependencies:
      - target: LicashCore
      - framework: build/native/Chain.xcframework
        embed: false
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.licash.wallet
        INFOPLIST_FILE: Licash/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The commit built, for Settings and the logs: xcodebuild LICASH_COMMIT=<hash> sets it.
        LICASH_COMMIT: unknown
  LicashTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LicashTests
    dependencies:
      - target: Licash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LicashUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LicashUITests
    dependencies:
      - target: Licash
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Licash:
    build:
      targets:
        Licash: all
    test:
      targets:
        - LicashTests
        - LicashUITests
