[package]
name = "licash-prover"
description = "Proving a RISC Zero program segment by segment, resumably: for phones."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
bincode = "1.3"
hex = "0.4"
# Dev mode would prove nothing: disabled, so no environment can turn it on.
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["prove", "std", "disable-dev-mode"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3.27"
