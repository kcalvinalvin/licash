[package]
name = "licash-e2e"
description = "End-to-end tests of hubs, their Lightning gateways, Nostr announcements and wallets on a regtest ecosystem"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
licash.workspace = true
licash-api.workspace = true
licash-nostr.workspace = true
licash-transport.workspace = true
licash-wallet.workspace = true
anyhow.workspace = true
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json.workspace = true
tempfile = "3.27"
tokio = { workspace = true, features = ["process", "time"] }
