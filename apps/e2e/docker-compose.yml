# A regtest ecosystem for the end-to-end tests: Bitcoin Core, two hubs with
# Lightning gateways over their own LND nodes, an outside LND node that
# pays and is paid, a swap provider between the hubs, a Nostr relay the
# hubs and the provider announce themselves on, and a Gotify server their
# operators are notified on. `run.sh` brings it up, runs the tests and
# removes it.
# Every port is published on 127.0.0.1 only: the hubs' and the provider's at
# fixed ports, which wallets keep across restarts, LICASH_E2E_HUB1,
# LICASH_E2E_HUB2 and LICASH_E2E_SWAPS, the rest at ports Docker picks.

x-lnd: &lnd
  image: lightninglabs/lnd:v0.21.6-beta@sha256:54b3c87ad0bc3fea3fab8af23ace6421147ea97e6b56bf3911592d7853c185b8
  depends_on:
    bitcoind:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "lncli", "--network=regtest", "getinfo"]
    interval: 2s
    timeout: 5s
    retries: 60
  entrypoint: ["lnd"]
  command:
  - --bitcoin.regtest
  - --bitcoin.node=bitcoind
  - --bitcoind.rpchost=bitcoind:18443
  - --bitcoind.rpcuser=licash
  - --bitcoind.rpcpass=licash
  - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
  - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
  - --noseedbackup
  - --nobootstrap
  - --listen=0.0.0.0:9735
  - --rpclisten=0.0.0.0:10009
  - --restlisten=0.0.0.0:8080

x-hub: &hub
  image: licash-hub:e2e
  build:
    context: ../..
    dockerfile: apps/hub/Dockerfile
  # Root, to read its LND node's macaroon.
  user: "0:0"
  entrypoint: ["sh", "-c"]
  environment:
    LICASH_HUB_CHAIN: http://licash:licash@bitcoind:18443
    LICASH_HUB_NETWORK: regtest
    LICASH_HUB_CHAIN_POLL: "1"
    LICASH_HUB_LND_MACAROON: /lnd/data/chain/bitcoin/regtest/admin.macaroon
    LICASH_HUB_LND_CERT: /lnd/tls.cert
    LICASH_HUB_NOSTR_RELAYS: ws://relay:8080
    LICASH_HUB_LOG: json
    RUST_LOG: info

services:
  bitcoind:
    image: bitcoin/bitcoin:30.0
    entrypoint: ["bitcoind"]
    command:
      - -regtest
      - -server
      - -printtoconsole
      # licash:licash, for this throwaway regtest only.
      - -rpcauth=licash:6c69636173682d6532652d73616c7421$$290f05ac8a7eb59151185233acb148039c315f534f56afe953ce22da6df910dd
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    ports:
      - "127.0.0.1::18443"
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=licash", "-rpcpassword=licash", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The outside world's Lightning node.
  outside-ln:
    <<: *lnd

  hub1-ln:
    <<: *lnd
    volumes:
      - hub1-ln:/root/.lnd

  hub2-ln:
    <<: *lnd
    volumes:
      - hub2-ln:/root/.lnd

  hub1:
    <<: *hub
    command:
      - >-
        [ -f /data/seed ] || licash-hub init; exec licash-hub run --lnd https://hub1-ln:8080
        --announce-url http://127.0.0.1:${LICASH_E2E_HUB1:-38338} --announce-name hub1
        --name hub1 --notify gotify://gotify/$$(cat /notify/token)
    ports:
      - "127.0.0.1:${LICASH_E2E_HUB1:-38338}:8338"
    volumes:
      - hub1:/data
      - hub1-ln:/lnd:ro
      - notify:/notify:ro
    depends_on:
      hub1-ln:
        condition: service_healthy
      gotify-app:
        condition: service_completed_successfully
      relay:
        condition: service_started

  hub2:
    <<: *hub
    command:
      - >-
        [ -f /data/seed ] || licash-hub init; exec licash-hub run --lnd https://hub2-ln:8080
        --announce-url http://127.0.0.1:${LICASH_E2E_HUB2:-38339} --announce-name hub2
        --name hub2 --notify gotify://gotify/$$(cat /notify/token)
    ports:
      - "127.0.0.1:${LICASH_E2E_HUB2:-38339}:8338"
    volumes:
      - hub2:/data
      - hub2-ln:/lnd:ro
      - notify:/notify:ro
    depends_on:
      hub2-ln:
        condition: service_healthy
      gotify-app:
        condition: service_completed_successfully
      relay:
        condition: service_started

  # Swaps between the hubs, which it reaches on this network, for 1 + 5000
  # ppm; the tests fund it.
  swaps:
    image: licash-swaps:e2e
    build:
      context: ../..
      dockerfile: apps/swaps/Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -f /data/swaps.sqlite ] || licash-swaps init;
        for hub in http://hub1:8338 http://hub2:8338; do
        until licash-wallet add-hub $$hub >/dev/null; do sleep 1; done; done;
        exec licash-swaps run --step 1 --fee-base 1 --fee-ppm 5000 --max 200000
        --nostr-relay ws://relay:8080 --announce-url http://127.0.0.1:${LICASH_E2E_SWAPS:-38340}
        --announce-name swaps --name swaps --notify gotify://gotify/$$(cat /notify/token)
    environment:
      LICASH_SWAPS_LOG: json
      LICASH_SWAPS_NETWORK: regtest
      RUST_LOG: info
    ports:
      - "127.0.0.1:${LICASH_E2E_SWAPS:-38340}:8340"
    volumes:
      - swaps:/data
      - notify:/notify:ro
    depends_on:
      hub1:
        condition: service_healthy
      hub2:
        condition: service_healthy

  gotify:
    image: &gotify gotify/server:2.9.1@sha256:a3af47067ce6aad76aadf5ba32d6ddfecd1ae576a961359f039fd1831e8b7652
    environment:
      GOTIFY_DEFAULTUSER_PASS: licash
    ports:
      - "127.0.0.1::80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The operators' Gotify application: its token in /notify/token.
  gotify-app:
    image: *gotify
    entrypoint: ["sh", "-c"]
    command:
      - >-
        [ -s /notify/token ] || curl -sf -u admin:licash -H 'Content-Type: application/json'
        -d '{"name":"licash"}' http://gotify/application
        | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' > /notify/token;
        test -s /notify/token
    volumes:
      - notify:/notify
    depends_on:
      gotify:
        condition: service_healthy

  relay:
    image: scsibug/nostr-rs-relay:0.10.0@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d
    ports:
      - "127.0.0.1::8080"

volumes:
  notify:
  hub1:
  hub2:
  swaps:
  hub1-ln:
  hub2-ln:
