[package]
name = "licash-wallet"
description = "Licash wallet: the notes an owner holds at its hubs, and the payments it makes and takes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
licash = { path = "../licash" }
licash-api = { path = "../licash-api" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
lightning-invoice = { version = "0.34", features = ["std"] }
thiserror.workspace = true
tracing = "0.1"
rand_core.workspace = true

[dev-dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-hub = { path = "../licash-hub" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt"] }
