[package]
name = "licash-contract"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false
description = "licash's recovery contract on Lichen's hub-proves graph"
# A member of regtest's workspace, not the core one: it pulls Lichen by
# path, which the core library must not depend on.
workspace = "../../regtest"

[dependencies]
anyhow = "1"
ark-bn254 = "0.5"
ark-groth16 = { version = "0.5", default-features = false, features = ["std"] }
k256 = "0.13"
licash = { path = "../licash" }
licash-hp = { path = "../licash-hp" }
lichen-babe = { path = "../../vendor/lichen/crates/babe" }
lichen-btc = { path = "../../vendor/lichen/crates/btc" }
lichen-contract = { path = "../../vendor/lichen/crates/contract" }
lichen-statement = { path = "../../vendor/lichen/crates/statement" }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
# Openings whose hub's secret or choice a fixture fixes: never for a real
# party.
fixture = []
