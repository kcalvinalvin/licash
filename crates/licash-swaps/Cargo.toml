[package]
name = "licash-swaps"
description = "Licash swap provider: swaps notes at one hub for notes at another, atomically, with its own wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
licash = { path = "../licash" }
licash-api = { path = "../licash-api" }
licash-wallet = { path = "../licash-wallet" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
tracing = "0.1"
rand_core.workspace = true

[dev-dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash-hub = { path = "../licash-hub" }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt"] }
