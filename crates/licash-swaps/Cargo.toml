[package]
name = "licash-swaps"
description = "Licash swap provider: swaps notes at one hub for notes at another, or pays them out on Bitcoin, atomically, with its own wallet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
licash = { path = "../licash" }
licash-api = { path = "../licash-api" }
licash-hub = { path = "../licash-hub" }
licash-lightning = { path = "../licash-lightning" }
licash-onchain = { path = "../licash-onchain" }
licash-wallet = { path = "../licash-wallet" }
lightning-invoice = { version = "0.34", features = ["std"] }
licash-store = { path = "../licash-store" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
tokio = { version = "1.54", features = ["rt", "sync"] }
tracing = "0.1"
rand_core.workspace = true

[dev-dependencies]
licash-lightning = { path = "../licash-lightning", features = ["fake"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt", "time"] }
